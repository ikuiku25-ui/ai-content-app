<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <title>オフラインです — はじめてのAI学習</title>
    <meta name="theme-color" content="#4F46E5" />

    <main class="card">
      <img class="card__logo" src="assets/icons/icon-192.png" alt="" width="72" height="72" />
