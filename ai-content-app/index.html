<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>はじめてのAI学習</title>
    <meta name="description" content="AI初心者のための学習コンテンツを、オフラインでも読めるアプリです。" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4F46E5" />

    <!-- iOSはmanifestを一部しか参照しないため、専用の指定を併記する -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI学習" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="card">
      <img class="card__logo" src="assets/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>はじめてのAI学習</h1>
      <p class="lead">
        AIを使ったことがない方のための学習ノートです。<br />
        一度開いた記事は、電波がなくても読めます。
      </p>

      <section class="articles">
        <h2 class="articles__heading">記事一覧</h2>
        <p id="article-list-status" class="status">記事を読み込んでいます…</p>
        <ul id="article-list" class="articles__list"></ul>
      </section>

      <p class="actions">
        <a class="button button--quiet" href="premium.html">購入者向けの記事を開く</a>
      </p>

      <section class="install">
        <!-- Android / PCのChromeなどでインストール可能になったときだけ表示する -->
        <button id="install-button" class="install__button" type="button" hidden>
          アプリとしてインストール
        </button>

        <!-- iOSでは上のボタンを出せないため、手順を案内する -->
        <p id="ios-hint" class="install__hint" hidden>
          iPhone・iPadでは、Safariの共有ボタン
          <strong>（□に↑のマーク）</strong> をタップし、<strong>「ホーム画面に追加」</strong>
          を選ぶとアプリとして使えます。
        </p>

        <p id="status" class="status">起動しています…</p>
      </section>
    </main>

    <script src="assets/js/sw-register.js"></script>
    <script src="assets/js/article-source.js"></script>
    <script src="assets/js/article-list.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
