<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>愛知の鉄道 平面確認</title>
<style>
  :root { --bg: #f6f7f9; --land: #ffffff; --ink: #1d2433; --muted: #5b6475; --panel: rgba(255,255,255,.92); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .panel { position: fixed; background: var(--panel); border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.12);
    font-size: 12px; line-height: 1.5; }
  #legend { top: calc(10px + env(safe-area-inset-top)); left: 10px; padding: 8px 10px; max-height: 70vh; overflow: auto; }
  #legend h1 { font-size: 13px; margin: 0 0 4px; }
  #legend .co { font-weight: 600; margin-top: 6px; }
  #legend .sw { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  #legend details summary { cursor: pointer; }
  #views { top: calc(10px + env(safe-area-inset-top)); right: 10px; padding: 6px; display: flex; gap: 6px; }
  #views button { font: inherit; padding: 6px 10px; border: 1px solid #ccd2dc; background: #fff; border-radius: 6px; }
  #attr { bottom: calc(6px + env(safe-area-inset-bottom)); right: 6px; padding: 3px 8px; font-size: 10px; color: var(--muted); }
  #err { position: fixed; inset: 40% 10px auto; text-align: center; color: #b00020; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="legend" class="panel"><details id="legend-details"><summary><h1 style="display:inline">路線（平面確認用）</h1></summary><div id="legend-body"></div></details></div>
<div id="views" class="panel">
  <button data-view="aichi">愛知全体</button>
  <button data-view="nagoya">名古屋中心</button>
</div>
<div id="attr" class="panel"></div>
<div id="err"></div>
<script type="module" src="js/preview2d.js"></script>
</body>
</html>
