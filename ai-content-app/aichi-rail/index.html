<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>愛知の鉄道3D路線図</title>
<meta name="description" content="名古屋市営地下鉄とJR東海・名鉄・近鉄の愛知県内の全路線・全駅を、実際の地理座標にもとづく3Dで表示します。">
<style>
  :root { --bg: #eef1f5; --ink: #1d2433; --muted: #5b6475; --panel: rgba(255,255,255,.92); --line: #ccd2dc; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .label { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 11px; line-height: 1;
    padding: 2px 3px; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 2px #fff;
    will-change: transform; }
  .label.major { font-size: 12.5px; font-weight: 600; }
  .label.under { color: #3b2a55; }
  .panel { position: fixed; background: var(--panel); border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.14);
    font-size: 12px; }
  #views { top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 5px;
    display: flex; gap: 5px; }
  #views button { font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); background: #fff;
    border-radius: 7px; color: var(--ink); white-space: nowrap; }
  #views button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #attr { bottom: calc(6px + env(safe-area-inset-bottom)); right: 6px; padding: 3px 8px; font-size: 10px; color: var(--muted);
    max-width: calc(100% - 24px); }
  #err { position: fixed; inset: 40% 16px auto; text-align: center; color: #b00020; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="views" class="panel">
  <button data-view="nagoya">名古屋中心</button>
  <button data-view="aichi">愛知全体</button>
  <button data-view="underground">地下から見る</button>
</div>
<div id="attr" class="panel"></div>
<div id="err"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
