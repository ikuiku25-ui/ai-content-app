<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img"
     aria-label="はじめの3ステップ。文章AIをひとつ選び、話しかけるように頼み、思ったものと違えば言い直す">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .num { font-size: 20px; font-weight: 700; fill: #ffffff; }
    .title { font-size: 17px; font-weight: 700; fill: #4338ca; }
    .body { font-size: 13px; fill: #6b6fa8; }
  </style>

  <defs>
    <marker id="step-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9aff2" />
    </marker>
  </defs>

  <rect width="720" height="250" rx="14" fill="#ffffff" />

  <g>
    <rect x="20" y="50" width="190" height="150" rx="16" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
    <circle cx="115" cy="82" r="18" fill="#4f46e5" />
    <text class="num" x="115" y="89" text-anchor="middle">1</text>
    <text class="title" x="115" y="126" text-anchor="middle">ひとつ選ぶ</text>
    <text class="body" x="115" y="152" text-anchor="middle">まずは文章のAIを</text>
    <text class="body" x="115" y="172" text-anchor="middle">1つだけ。無料で試せる</text>
  </g>

  <line x1="218" y1="125" x2="256" y2="125" stroke="#a9aff2" stroke-width="3" marker-end="url(#step-arrow)" />

  <g>
    <rect x="264" y="50" width="190" height="150" rx="16" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
    <circle cx="359" cy="82" r="18" fill="#4f46e5" />
    <text class="num" x="359" y="89" text-anchor="middle">2</text>
    <text class="title" x="359" y="126" text-anchor="middle">話しかける</text>
    <text class="body" x="359" y="152" text-anchor="middle">友だちに頼むように</text>
    <text class="body" x="359" y="172" text-anchor="middle">ふつうの言葉でよい</text>
  </g>

  <line x1="462" y1="125" x2="500" y2="125" stroke="#a9aff2" stroke-width="3" marker-end="url(#step-arrow)" />

  <g>
    <rect x="508" y="50" width="190" height="150" rx="16" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
    <circle cx="603" cy="82" r="18" fill="#4f46e5" />
    <text class="num" x="603" y="89" text-anchor="middle">3</text>
    <text class="title" x="603" y="126" text-anchor="middle">言い直す</text>
    <text class="body" x="603" y="152" text-anchor="middle">ちがったら、そう伝えて</text>
    <text class="body" x="603" y="172" text-anchor="middle">もう一度頼めばよい</text>
  </g>

  <text class="body" x="360" y="228" text-anchor="middle">最初からうまく頼めなくて大丈夫。やり直しは何度でもできる</text>
</svg>
