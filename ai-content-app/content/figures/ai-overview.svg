<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-label="AIという広い言葉の中に、文章や絵を作る生成AIが含まれていることを示す図">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .label { font-size: 22px; font-weight: 700; }
    .note { font-size: 15px; }
  </style>

  <rect width="640" height="320" rx="14" fill="#ffffff" />

  <rect x="18" y="18" width="604" height="284" rx="26" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
  <text class="label" x="48" y="62" fill="#4338ca">AI</text>
  <text class="note" x="48" y="90" fill="#6b6fa8">コンピュータが賢く振る舞う仕組み、ぜんぶ</text>

  <rect x="70" y="118" width="500" height="152" rx="20" fill="#4f46e5" />
  <text class="label" x="102" y="164" fill="#ffffff">生成AI</text>
  <text class="note" x="102" y="196" fill="#dcdafb">文章や絵を、新しく作ってくれるもの</text>
  <text class="note" x="102" y="228" fill="#dcdafb">この記事で使ってみたのは、これ</text>
</svg>
