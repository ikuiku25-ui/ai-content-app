<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"
     aria-label="AIの中に機械学習があり、その中に生成AIがある入れ子構造の図">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .label { font-size: 21px; font-weight: 700; }
  </style>

  <rect width="640" height="400" rx="14" fill="#ffffff" />

  <rect x="18" y="18" width="604" height="364" rx="26" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
  <text class="label" x="44" y="58" fill="#4338ca">AI（人工知能）</text>
  <text x="44" y="84" font-size="15" fill="#6b6fa8">賢く振る舞う仕組み全般</text>

  <rect x="76" y="106" width="488" height="256" rx="22" fill="#dde0fc" stroke="#a9aff2" stroke-width="2" />
  <text class="label" x="102" y="146" fill="#4338ca">機械学習</text>
  <text x="102" y="172" font-size="15" fill="#6b6fa8">データから規則性を学びとる</text>

  <rect x="134" y="194" width="372" height="146" rx="18" fill="#4f46e5" />
  <text class="label" x="160" y="236" font-size="26" fill="#ffffff">生成AI</text>
  <text x="160" y="268" font-size="15" fill="#dcdafb">文章や画像を新しく作り出す</text>
  <text x="160" y="300" font-size="15" fill="#dcdafb">例: ChatGPT、画像生成AI</text>
</svg>
