<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-label="AIとやりとりする画面の例。自分が頼んだ文と、AIが返してきたお知らせ文が並んでいる">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; }
    .me { fill: #ffffff; }
    .ai { fill: #3a3d55; }
    .muted { fill: #9aa0b8; font-size: 13px; }
  </style>

  <rect width="640" height="420" rx="14" fill="#ffffff" stroke="#e4e4ee" stroke-width="2" />

  <rect x="2" y="2" width="636" height="46" rx="12" fill="#f4f4f9" />
  <circle cx="30" cy="25" r="6" fill="#e2e3ec" />
  <circle cx="50" cy="25" r="6" fill="#e2e3ec" />
  <circle cx="70" cy="25" r="6" fill="#e2e3ec" />
  <text class="muted" x="320" y="30" text-anchor="middle">AIの画面</text>

  <text class="muted" x="612" y="86" text-anchor="end">あなたが打った文</text>
  <rect x="196" y="96" width="416" height="58" rx="16" fill="#4f46e5" />
  <text class="me" x="592" y="122" text-anchor="end">夏祭りのお知らせを、みじかい文で書いて。</text>
  <text class="me" x="592" y="144" text-anchor="end">8月20日です。</text>

  <text class="muted" x="28" y="196">AIの返事</text>
  <rect x="28" y="206" width="440" height="146" rx="16" fill="#f4f4f9" />
  <text class="ai" x="52" y="238" font-weight="700">夏祭りのお知らせ</text>
  <text class="ai" x="52" y="268">8月20日に夏祭りを行います。</text>
  <text class="ai" x="52" y="296">ぜひご参加ください。</text>
  <text class="muted" x="52" y="328">もっとていねいな言い方にもできます。</text>

  <rect x="28" y="374" width="584" height="46" rx="23" fill="#ffffff" stroke="#e4e4ee" stroke-width="2" />
  <text class="muted" x="54" y="403">ここに文字を打ちます</text>
  <circle cx="578" cy="397" r="16" fill="#4f46e5" />
  <path d="M 571 397 L 585 397 M 579 391 L 585 397 L 579 403" stroke="#ffffff" stroke-width="2"
        fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
