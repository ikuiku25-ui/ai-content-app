<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"
     aria-label="AIの答えを、そのまま使ってよいものと必ず確かめるものに分けた図">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .head { font-size: 18px; font-weight: 700; }
    .item { font-size: 14px; }
  </style>

  <rect width="720" height="400" rx="14" fill="#ffffff" />

  <rect x="250" y="20" width="220" height="56" rx="16" fill="#4f46e5" />
  <text x="360" y="55" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">
    AIが返してきた答え
  </text>

  <path d="M360 76 V104 M170 104 H550 M170 104 V132 M550 104 V132"
        stroke="#a9aff2" stroke-width="3" fill="none" stroke-linecap="round" />

  <g>
    <rect x="20" y="132" width="330" height="244" rx="16" fill="#eef0fe" stroke="#c7cbf7" stroke-width="2" />
    <text class="head" x="48" y="172" fill="#4338ca">そのまま使ってよい</text>

    <circle cx="54" cy="212" r="4" fill="#4f46e5" />
    <text class="item" x="70" y="217" fill="#4a4e70">文章の言い換え</text>

    <circle cx="54" cy="252" r="4" fill="#4f46e5" />
    <text class="item" x="70" y="257" fill="#4a4e70">下書き・たたき台</text>

    <circle cx="54" cy="292" r="4" fill="#4f46e5" />
    <text class="item" x="70" y="297" fill="#4a4e70">アイデアの候補</text>

    <circle cx="54" cy="332" r="4" fill="#4f46e5" />
    <text class="item" x="70" y="337" fill="#4a4e70">書き出しの案</text>
  </g>

  <g>
    <rect x="370" y="132" width="330" height="244" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" />
    <text class="head" x="398" y="172" fill="#b45309">必ず確かめる</text>

    <circle cx="404" cy="212" r="4" fill="#ea9a3c" />
    <text class="item" x="420" y="217" fill="#6b5638">数字・日付</text>

    <circle cx="404" cy="252" r="4" fill="#ea9a3c" />
    <text class="item" x="420" y="257" fill="#6b5638">人名・会社名・商品名</text>

    <circle cx="404" cy="292" r="4" fill="#ea9a3c" />
    <text class="item" x="420" y="297" fill="#6b5638">法律・お金・健康の話</text>

    <circle cx="404" cy="332" r="4" fill="#ea9a3c" />
    <text class="item" x="420" y="337" fill="#6b5638">引用や出典があるもの</text>
  </g>
</svg>
