# ai-content-app/ フォルダだけをGitHub Pagesへ公開する。
# リポジトリ直下にはtools/やdocs/もあるため、Pagesの標準設定
#（リポジトリ直下 or /docs を公開）ではなくActionsで対象を絞っている。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ai-content-app

      - id: deployment
        uses: actions/deploy-pages@v4
